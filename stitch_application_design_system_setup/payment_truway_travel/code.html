<!-- Interactive Radio Behavior Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const labels = document.querySelectorAll('label');
      labels.forEach(label => {
        label.addEventListener('click', () => {
          labels.forEach(l => {
            const circle = l.querySelector('.w-5');
            const dot = l.querySelector('.w-2\\.5');
            if (circle && dot) {
              circle.classList.remove('border-primary-container');
              circle.classList.add('border-outline-variant');
              dot.classList.remove('bg-primary-container');
              dot.classList.add('bg-transparent');
            }
          });
          const activeCircle = label.querySelector('.w-5');
          const activeDot = label.querySelector('.w-2\\.5');
          if (activeCircle && activeDot) {
            activeCircle.classList.remove('border-outline-variant');
            activeCircle.classList.add('border-primary-container');
            activeDot.classList.remove('bg-transparent');
            activeDot.classList.add('bg-primary-container');
          }
        });
      });
    });
  </script>

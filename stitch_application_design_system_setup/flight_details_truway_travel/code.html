<!-- Mobile Frame Container mirroring pixel-perfect Truway spec -->
<main class="w-full max-w-[390px] h-[844px] bg-surface-canvas relative flex flex-col overflow-hidden rounded-[40px] shadow-2xl border border-card-border">
<!-- Top Status Bar (iOS standard) -->

<span class="text-body-sm font-label-lg tracking-tight">9:41</span>
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-[17px] leading-none">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[17px] leading-none">wifi</span>
<span class="material-symbols-outlined text-[19px] leading-none">battery_full</span>
</div>
</header>
<!-- App Top Navigation Bar -->
<nav class="w-full px-margin-mobile py-2 flex items-center justify-between z-20">
<button aria-label="Go Back" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface hover:bg-royal-blue-light active:scale-95 transition-all duration-150">
<span class="material-symbols-outlined text-[22px]">arrow_back</span>
</button>
<h1 class="text-headline-sm font-headline-sm text-on-surface tracking-tight">

</button>
</nav>

<div class="flex-1 overflow-y-auto px-margin-mobile pt-2 pb-24 space-y-4">

</div>
</div>
<div class="w-full h-px bg-card-border"></div>
<!-- Airline & Cabin Details -->
<div class="flex items-center space-x-3">

</div>

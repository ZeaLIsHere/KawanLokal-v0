<!-- Screen Status Bar (9:41, Cellular, Wifi, Battery) -->

<div class="flex items-center space-x-1.5 text-on-surface">
<span class="material-symbols-outlined text-[15px] leading-none" data-icon="signal_cellular_4_bar">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[15px] leading-none" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[17px] leading-none" data-icon="battery_full">battery_full</span>
</div>
</header>
<!-- Brand Header Section -->

</div>

</section>

<div class="absolute inset-0 bg-gradient-to-t from-surface-card/60 via-transparent to-transparent pointer-events-none"></div>
</div>
</section>
<!-- Bottom Action Card / Onboarding CTA -->
<footer class="w-full px-6 pt-3 pb-8 z-20 bg-surface-card flex flex-col shrink-0">
